workflows:
  mac-build:
    name: macOS build, sign, package and test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        VERSION: "3.6.2"
    scripts:
      - name: Install .NET 9 and Go
        script: |
          set -e
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "PATH=$HOME/.dotnet:$HOME/go-sdk/go/bin:$PATH" >> "$CM_ENV"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$CM_ENV"
          GO_VER=$(awk '/^go /{print $2}' core-go/go.mod)
          mkdir -p "$HOME/go-sdk"
          curl -sSL "https://go.dev/dl/go${GO_VER}.darwin-arm64.tar.gz" | tar -xz -C "$HOME/go-sdk"
          "$HOME/go-sdk/go/bin/go" version
          "$HOME/.dotnet/dotnet" --version

      - name: Build pbcore
        script: |
          set -e
          cd core-go
          go vet ./...
          go test ./...
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/pbcore-darwin-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/pbcore-darwin-amd64 .

      - name: Build, sign and package
        script: |
          set -euo pipefail
          mkdir -p out work
          build_one() {
            rid="$1"; suffix="$2"; core="$3"
            pub="work/publish-$rid"
            dotnet publish gui/ProxyBridge.GUI.csproj -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=false -p:DebugType=none -o "$pub"
            root="work/root-$suffix"
            app="$root/ProxyBridge.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp -R "$pub"/. "$app/Contents/MacOS/"
            rm -f "$app/Contents/MacOS/ProxyBridgeCore.dll" "$app/Contents/MacOS/WinDivert.dll" "$app/Contents/MacOS/WinDivert64.sys"
            cp "core-go/dist/$core" "$app/Contents/MacOS/pbcore"
            cp mac/install-helper.sh mac/uninstall-helper.sh "$app/Contents/MacOS/"
            cp branding/logo.icns "$app/Contents/Resources/logo.icns"
            cp LICENSE "$app/Contents/Resources/LICENSE.txt"
            cp THIRD_PARTY_NOTICES.txt "$app/Contents/Resources/THIRD_PARTY_NOTICES.txt"
            printf 'APPL????' > "$app/Contents/PkgInfo"
            cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>ProxyBridge</string>
              <key>CFBundleDisplayName</key><string>ProxyBridge</string>
              <key>CFBundleIdentifier</key><string>org.proxybridge.app</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleExecutable</key><string>ProxyBridge</string>
              <key>CFBundleIconFile</key><string>logo.icns</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
          </dict>
          </plist>
          EOF
            chmod +x "$app/Contents/MacOS/ProxyBridge" "$app/Contents/MacOS/pbcore" "$app/Contents/MacOS/"*.sh
            # Ad-hoc signature: nested files first (the .dll files get their signatures in extended
            # attributes), the main executable last through the bundle itself. No Apple account needed.
            find "$app/Contents/MacOS" -type f ! -name ProxyBridge -print0 | xargs -0 -n 1 codesign --force --sign - --timestamp=none
            codesign --force --sign - --timestamp=none "$app"
            codesign --verify --deep --strict "$app"
            # Installer package: an app installed by Installer is not quarantined.
            pkgbuild --analyze --root "$root" "work/comp-$suffix.plist"
            plutil -replace 0.BundleIsRelocatable -bool NO "work/comp-$suffix.plist"
            pkgbuild --root "$root" --component-plist "work/comp-$suffix.plist" --install-location /Applications \
              --identifier org.proxybridge.app --version "$VERSION" "out/ProxyBridge-${VERSION}-macOS-$suffix.pkg"
            ditto -c -k --sequesterRsrc --keepParent "$app" "out/ProxyBridge-${VERSION}-macOS-$suffix.zip"
          }
          build_one osx-arm64 arm64 pbcore-darwin-arm64
          build_one osx-x64 x64 pbcore-darwin-amd64
          ls -la out

      - name: Install the arm64 package and start the app
        script: |
          set +e
          sudo installer -pkg "out/ProxyBridge-${VERSION}-macOS-arm64.pkg" -target /
          app=/Applications/ProxyBridge.app
          echo "quarantine after install:"; xattr -p com.apple.quarantine "$app" 2>/dev/null || echo "none"
          codesign --verify --deep --strict "$app" && echo "signature ok"
          spctl --assess --type execute "$app" 2>&1
          "$app/Contents/MacOS/pbcore" --version
          PROXYBRIDGE_CONFIG_DIR="$(mktemp -d)" "$app/Contents/MacOS/ProxyBridge" > out/pkg-app-start.log 2>&1 &
          pid=$!; sleep 20
          if kill -0 "$pid" 2>/dev/null; then echo "PKG APP: RUNNING after 20 s"; else echo "PKG APP: EXITED"; fi
          kill "$pid" 2>/dev/null
          grep -v -E "^\s|^$|^struct|^vertex|^fragment|^Error Domain|^#" out/pkg-app-start.log | tail -n 20
          echo "== ps comm sample (full paths expected)"; ps -axo pid=,comm= | head -5
          exit 0

      - name: Core end-to-end test (per-program rules through a real proxy)
        script: |
          set +e
          if [ -z "${TEST_PROXY:-}" ]; then echo "TEST_PROXY not set, skipping"; exit 0; fi
          core=/Applications/ProxyBridge.app/Contents/MacOS/pbcore
          python3 - "$TEST_PROXY" <<'PY' > /tmp/rules1.json
          import json, sys
          print(json.dumps({"proxies": [{"id": 1, "url": sys.argv[1]}],
                            "rules": [{"process": "curl", "action": "direct"},
                                      {"process": "*", "action": "proxy", "proxy": 1}]}))
          PY
          direct_ip=$(curl -4 -sS -m 15 https://api.ipify.org); echo "direct IP: $direct_ip"
          # the same launcher the app writes (no nohup), run as root without a console
          cat > /tmp/pb-launch.sh <<EOF
          #!/bin/sh
          trap '' HUP
          "$core" --rules-file /tmp/rules1.json --dns 1.1.1.1 --control-port 34050 --control-token t0k --log-level debug > /tmp/pbcore.log 2>&1 < /dev/null &
          exit 0
          EOF
          sudo /bin/sh /tmp/pb-launch.sh < /dev/null
          for i in $(seq 1 30); do grep -q '"status":"up"' /tmp/pbcore.log && break; sleep 0.5; done
          grep -E 'procmap|up:|rule |proxy 1' /tmp/pbcore.log
          tun=$(sed -n 's/.*TUN \(utun[0-9]*\) created.*/\1/p' /tmp/pbcore.log | head -1)
          echo "tun=$tun"; ifconfig "$tun" 2>&1 | head -3
          echo "== routes"; netstat -rn -f inet | grep -E "^(default|0/1|128.0/1|10.255|1.1.1.1)"
          sudo tcpdump -i "$tun" -n -c 60 > /tmp/tcpdump.log 2>&1 &
          echo "ping: $(printf 'ping t0k\n' | nc -w 3 127.0.0.1 34050)"
          echo "== netstat sample"; netstat -anv -p tcp | head -4

          echo "== 1) curl (rule: direct) https"
          curl -4 -sS -m 40 -w ' [%{http_code} %{time_total}s]\n' https://api.ipify.org; echo " exit=$?"
          echo "== 2) python3 (catch-all: proxy) http"
          python3 -c "import urllib.request; print(urllib.request.urlopen('http://ip-api.com/json/?fields=query,country,city', timeout=40).read().decode())"; echo " exit=$?"
          echo "== 3) python3 (catch-all: proxy) https"
          python3 -c "import urllib.request; print(urllib.request.urlopen('https://api.ipify.org', timeout=40).read().decode())"; echo " exit=$?"

          echo "== 4) live rules: curl -> proxy"
          rules2=$(python3 - "$TEST_PROXY" <<'PY'
          import base64, json, sys
          s = json.dumps({"proxies": [{"id": 1, "url": sys.argv[1]}], "rules": [{"process": "curl", "action": "proxy", "proxy": 1}]})
          print(base64.b64encode(s.encode()).decode())
          PY
          )
          echo "rules reply: $(printf 'rules t0k %s\n' "$rules2" | nc -w 5 127.0.0.1 34050)"
          curl -4 -sS -m 40 -w ' [%{http_code} %{time_total}s]\n' https://api.ipify.org; echo " exit=$?"
          echo "== 5) no rule for python3 now -> direct"
          python3 -c "import urllib.request; print(urllib.request.urlopen('https://api.ipify.org', timeout=40).read().decode())"; echo " exit=$?"
          echo "== 6) block rule for curl"
          rules3=$(python3 - "$TEST_PROXY" <<'PY'
          import base64, json, sys
          s = json.dumps({"proxies": [{"id": 1, "url": sys.argv[1]}], "rules": [{"process": "/usr/bin/curl", "action": "block"}, {"process": "*", "action": "proxy", "proxy": 1}]})
          print(base64.b64encode(s.encode()).decode())
          PY
          )
          echo "rules reply: $(printf 'rules t0k %s\n' "$rules3" | nc -w 5 127.0.0.1 34050)"
          curl -4 -sS -m 15 https://api.ipify.org; echo " curl exit=$? (expected: connection reset)"

          echo "== pbcore log (last 60)"; tail -n 60 /tmp/pbcore.log
          echo "== tcpdump"; sleep 2; sudo pkill tcpdump; head -70 /tmp/tcpdump.log
          printf 'stop t0k\n' | nc -w 3 127.0.0.1 34050
          sleep 3
          echo "IP after stop: $(curl -4 -sS -m 15 https://api.ipify.org)"
          cp /tmp/pbcore.log out/pbcore-e2e.log; cp /tmp/tcpdump.log out/tcpdump.log
          sudo pkill -f pbcore
          exit 0

      - name: Daemon end-to-end test (launchd helper, start/stop without a new process)
        script: |
          set +e
          if [ -z "${TEST_PROXY:-}" ]; then echo "TEST_PROXY not set, skipping"; exit 0; fi
          app=/Applications/ProxyBridge.app/Contents/MacOS
          sudo /bin/sh "$app/install-helper.sh" "$app/pbcore"; echo "install exit=$?"
          ls -la /Library/PrivilegedHelperTools/org.proxybridge.pbcore /Library/LaunchDaemons/org.proxybridge.pbcore.plist "/Library/Application Support/ProxyBridge/control.token"
          sudo launchctl print system/org.proxybridge.pbcore | grep -E "state|pid" | head -3
          tok=$(sudo cat "/Library/Application Support/ProxyBridge/control.token")
          sock="/Library/Application Support/ProxyBridge/control.sock"
          echo "token readable by builder (admin)? $(cat "/Library/Application Support/ProxyBridge/control.token" > /dev/null 2>&1 && echo yes || echo no)"
          ls -l "$sock"
          for i in $(seq 1 20); do r=$(printf 'ping %s\n' "$tok" | nc -w 2 127.0.0.1 34050); [ -n "$r" ] && break; sleep 0.5; done
          echo "tcp ping: $r (expected: ok ${VERSION})"
          echo "unix ping: $(printf 'ping %s\n' "$tok" | nc -w 2 -U "$sock") (expected: ok ${VERSION})"
          echo "== loopback TCP filtered by pf (what a VPN kill switch does): the unix socket must still answer"
          pf_was=$(sudo pfctl -s info 2>/dev/null | head -1)
          echo "block drop quick proto tcp from any to 127.0.0.1 port 34050" > /tmp/pbtest.rules
          { cat /etc/pf.conf; echo 'anchor "pbtest"'; echo 'load anchor "pbtest" from "/tmp/pbtest.rules"'; } | sudo pfctl -f - 2>&1 | grep -v "^$"
          sudo pfctl -e 2>&1 | head -1
          sudo pfctl -a pbtest -s rules 2>/dev/null
          echo "tcp ping, filtered: '$(printf 'ping %s\n' "$tok" | nc -w 2 127.0.0.1 34050)' (expected empty)"
          echo "unix ping, filtered: $(printf 'ping %s\n' "$tok" | nc -w 2 -U "$sock") (expected: ok ${VERSION})"
          sudo pfctl -f /etc/pf.conf 2>&1 | grep -v "^$"
          case "$pf_was" in *Enabled*) ;; *) sudo pfctl -d 2>&1 | head -1 ;; esac
          echo "tcp ping, filter removed: $(printf 'ping %s\n' "$tok" | nc -w 2 127.0.0.1 34050)"
          req=$(python3 - "$TEST_PROXY" <<'PY'
          import base64, json, os, sys
          s = json.dumps({"proxies": [{"id": 1, "url": sys.argv[1]}],
                          "rules": [{"process": "curl", "action": "direct"}, {"process": "*", "action": "proxy", "proxy": 1}],
                          "dns": "1.1.1.1", "parent_pid": os.getppid()})
          print(base64.b64encode(s.encode()).decode())
          PY
          )
          direct_ip=$(curl -4 -sS -m 15 https://api.ipify.org); echo "direct IP: $direct_ip"
          echo "start: $(printf 'start %s %s\n' "$tok" "$req" | nc -w 60 127.0.0.1 34050)"
          echo "watch replay: $(printf 'watch %s\n' "$tok" | nc -w 2 127.0.0.1 34050 | head -1)"
          echo "== 1) curl (direct)"; curl -4 -sS -m 30 https://api.ipify.org; echo " exit=$?"
          echo "== 2) python3 (proxy)"; python3 -c "import urllib.request; print(urllib.request.urlopen('https://api.ipify.org', timeout=40).read().decode())"; echo " exit=$?"
          echo "stop: $(printf 'stop %s\n' "$tok" | nc -w 3 127.0.0.1 34050)"
          sleep 2
          echo "after stop, daemon alive: $(printf 'ping %s\n' "$tok" | nc -w 2 127.0.0.1 34050)"
          echo "after stop, python3 direct: $(python3 -c "import urllib.request; print(urllib.request.urlopen('https://api.ipify.org', timeout=30).read().decode())")"
          echo "== second start on the same daemon"
          echo "start: $(printf 'start %s %s\n' "$tok" "$req" | nc -w 60 127.0.0.1 34050)"
          echo "python3 (proxy again): $(python3 -c "import urllib.request; print(urllib.request.urlopen('https://api.ipify.org', timeout=40).read().decode())")"
          echo "stop: $(printf 'stop %s\n' "$tok" | nc -w 3 127.0.0.1 34050)"
          sleep 1
          echo "== daemon log (last 40)"; sudo tail -n 40 /Library/Logs/ProxyBridge/pbcore.log
          sudo /bin/sh "$app/uninstall-helper.sh"; echo "uninstall exit=$?"
          sleep 1
          echo "after uninstall, ping: '$(printf 'ping %s\n' "$tok" | nc -w 2 127.0.0.1 34050)' (expected empty)"
          ls /Library/LaunchDaemons/org.proxybridge.pbcore.plist 2>&1 | head -1
          exit 0

      - name: VPN coexistence test (a tunnel already owns 0/1 and 128/1 when the session starts)
        script: |
          set +e
          if [ -z "${TEST_PROXY:-}" ]; then echo "TEST_PROXY not set, skipping"; exit 0; fi
          app=/Applications/ProxyBridge.app/Contents/MacOS
          core="$app/pbcore"
          direct_ip=$(curl -4 -sS -m 15 https://api.ipify.org); echo "direct IP: $direct_ip"
          sudo /bin/sh "$app/install-helper.sh" "$core" >/dev/null; echo "install exit=$?"
          # 1) the "VPN": a per-session pbcore (a copy, so the helper scripts never touch it) that routes
          #    everything direct through its own utun and holds the 0/1 and 128/1 routes
          cp "$core" /tmp/vpncore; chmod +x /tmp/vpncore
          echo '{"proxies":[],"rules":[{"process":"*","action":"direct"}]}' > /tmp/vpn.json
          cat > /tmp/vpn-launch.sh <<EOF
          #!/bin/sh
          trap '' HUP
          /tmp/vpncore --rules-file /tmp/vpn.json --dns 1.1.1.1 --tun-addr 10.254.0.2/24 --control-port 34060 --control-token vpn --log-level debug > /tmp/vpn.log 2>&1 < /dev/null &
          exit 0
          EOF
          sudo /bin/sh /tmp/vpn-launch.sh < /dev/null
          for i in $(seq 1 30); do grep -q '"status":"up"' /tmp/vpn.log && break; sleep 0.5; done
          vtun=$(sed -n 's/.*TUN \(utun[0-9]*\) created.*/\1/p' /tmp/vpn.log | head -1); echo "vpn tun=$vtun"
          echo "== routes with the VPN up"; netstat -rn -f inet | grep -E "^(default|0/1|128.0/1|0/2|64/2|128.0/2|192.0/2)"
          echo "curl through the VPN: $(curl -4 -sS -m 30 https://api.ipify.org) (expected: $direct_ip)"
          echo "route to 8.8.8.8:"; route -n get 8.8.8.8 | grep -E "interface|gateway"
          # 2) the daemon starts a session on top of it
          tok=$(sudo cat "/Library/Application Support/ProxyBridge/control.token")
          sock="/Library/Application Support/ProxyBridge/control.sock"
          for i in $(seq 1 20); do r=$(printf 'ping %s\n' "$tok" | nc -w 2 -U "$sock"); [ -n "$r" ] && break; sleep 0.5; done; echo "ping: $r"
          req=$(python3 - "$TEST_PROXY" <<'PY'
          import base64, json, os, sys
          s = json.dumps({"proxies": [{"id": 1, "url": sys.argv[1]}],
                          "rules": [{"process": "curl", "action": "direct"}, {"process": "*", "action": "proxy", "proxy": 1}],
                          "dns": "1.1.1.1", "parent_pid": os.getppid()})
          print(base64.b64encode(s.encode()).decode())
          PY
          )
          echo "start: $(printf 'start %s %s\n' "$tok" "$req" | nc -w 60 -U "$sock")"
          echo "== routes with both up (expected: the /2 set on the daemon's utun, the /1 pair still on $vtun)"
          netstat -rn -f inet | grep -E "^(default|0/1|128.0/1|0/2|64/2|128.0/2|192.0/2)"
          echo "== daemon log: gateway decision"; sudo grep -E "VPN|default route|routes installed|routes are taken|scoped|exec: route" /Library/Logs/ProxyBridge/pbcore.log | tail -12
          echo "== fake VPN still alive: $(pgrep -f vpncore | head -1)"
          echo "== 1) curl (rule: direct, should still leave through the VPN) "; curl -4 -sS -m 40 https://api.ipify.org; echo " exit=$? (expected: $direct_ip)"
          echo "== 2) python3 (catch-all: proxy)"; python3 -c "import urllib.request; print(urllib.request.urlopen('https://api.ipify.org', timeout=40).read().decode())"; echo " exit=$? (expected: the proxy IP)"
          echo "== 3) the VPN's own log saw the daemon's flows as direct:"; grep -c "direct" /tmp/vpn.log
          echo "stop: $(printf 'stop %s\n' "$tok" | nc -w 3 -U "$sock")"
          sleep 2
          echo "== routes after stop (expected: only the /1 pair on $vtun)"; netstat -rn -f inet | grep -E "^(0/1|128.0/1|0/2|64/2|128.0/2|192.0/2)"
          echo "python3 after stop (VPN only): $(python3 -c "import urllib.request; print(urllib.request.urlopen('https://api.ipify.org', timeout=30).read().decode())") (expected: $direct_ip)"
          echo "== daemon log (last 30)"; sudo tail -n 30 /Library/Logs/ProxyBridge/pbcore.log
          sudo /bin/sh "$app/uninstall-helper.sh" >/dev/null; echo "uninstall exit=$?"
          printf 'stop vpn\n' | nc -w 3 127.0.0.1 34060; sleep 3
          echo "== routes after the VPN is gone"; netstat -rn -f inet | grep -E "^(0/1|128.0/1|0/2|64/2)" || echo "(none, as expected)"
          echo "IP after everything: $(curl -4 -sS -m 15 https://api.ipify.org)"
          cp /tmp/vpn.log out/vpn-coexistence-vpn.log
          sudo pkill -f vpncore; sudo pkill -f pbcore
          exit 0

      - name: UDP end-to-end test (SOCKS5 UDP, block mode, DNS via proxy)
        script: |
          set +e
          if [ -z "${TEST_PROXY:-}" ] || [ -z "${TEST_PROXY_UDP:-}" ]; then echo "TEST_PROXY / TEST_PROXY_UDP not set, skipping"; exit 0; fi
          app=/Applications/ProxyBridge.app/Contents/MacOS
          sudo /bin/sh "$app/install-helper.sh" "$app/pbcore" >/dev/null; tok=$(sudo cat "/Library/Application Support/ProxyBridge/control.token")
          for i in $(seq 1 20); do r=$(printf 'ping %s\n' "$tok" | nc -w 2 127.0.0.1 34050); [ -n "$r" ] && break; sleep 0.5; done; echo "ping: $r"
          udp_host=$(python3 -c "import sys,urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname)" "$TEST_PROXY_UDP")
          direct_ip=$(curl -4 -sS -m 15 https://api.ipify.org); echo "direct IP: $direct_ip, UDP proxy host: $udp_host"
          cat > /tmp/stun.py <<'PY'
          import os, socket, struct, sys
          # STUN Binding Request straight from this process (the tunnel decides where it goes)
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(float(sys.argv[1]) if len(sys.argv) > 1 else 4)
          tid = os.urandom(12); req = struct.pack("!HHI", 1, 0, 0x2112A442) + tid
          try:
              s.sendto(req, (socket.gethostbyname("stun.l.google.com"), 19302))
              d, _ = s.recvfrom(2048)
          except Exception as e:
              print("STUN failed:", type(e).__name__, e); sys.exit(2)
          off = 20
          while off + 4 <= len(d):
              at, al = struct.unpack("!HH", d[off:off+4]); v = d[off+4:off+4+al]
              if at == 0x20 and al >= 8:
                  print("STUN mapped IP:", ".".join(str(b ^ m) for b, m in zip(v[4:8], b"\x21\x12\xa4\x42"))); sys.exit(0)
              off += 4 + ((al + 3) & ~3)
          print("STUN: no mapped address"); sys.exit(3)
          PY
          cat > /tmp/dnsq.py <<'PY'
          import os, socket, struct, sys
          # raw DNS query for example.com to the resolver given on the command line (udp/53)
          server = sys.argv[1]
          tid = os.urandom(2); q = tid + b"\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00" + b"\x07example\x03com\x00\x00\x01\x00\x01"
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(5)
          try:
              s.sendto(q, (server, 53)); d, _ = s.recvfrom(1024)
          except Exception as e:
              print("DNS failed:", type(e).__name__, e); sys.exit(2)
          ok = d[:2] == tid and d[2] & 0x80 and (d[3] & 0x0F) == 0 and struct.unpack("!H", d[6:8])[0] > 0
          print("DNS answer via", server, ":", "ok" if ok else "bad", len(d), "bytes"); sys.exit(0 if ok else 3)
          PY
          start() {  # $1 udp mode, $2 dns via proxy, $3 proxy url for python3
            req=$(python3 - "$3" "$1" "$2" <<'PY'
          import base64, json, os, sys
          s = json.dumps({"proxies": [{"id": 1, "url": sys.argv[1]}],
                          "rules": [{"process": "curl", "action": "direct"}, {"process": "python3", "action": "proxy", "proxy": 1}],
                          "udp": sys.argv[2], "dns_via_proxy": sys.argv[3] == "1", "dns": "1.1.1.1", "parent_pid": os.getppid()})
          print(base64.b64encode(s.encode()).decode())
          PY
          )
            echo "start udp=$1 dns_via_proxy=$2: $(printf 'start %s %s\n' "$tok" "$req" | nc -w 60 127.0.0.1 34050)"
          }
          stop() { printf 'stop %s\n' "$tok" | nc -w 3 127.0.0.1 34050 >/dev/null; sleep 1; }
          resolver=$(scutil --dns | awk '/nameserver\[0\]/{print $3; exit}'); echo "system resolver: $resolver"

          echo "== A) udp=proxy with a UDP-capable proxy: python3 STUN must show $udp_host"
          start proxy 1 "$TEST_PROXY_UDP"
          python3 /tmp/stun.py 6; echo " exit=$? (expected 0, IP $udp_host)"
          echo "== B) DNS via proxy: query to the private resolver $resolver is answered through the proxy"
          python3 /tmp/dnsq.py "$resolver"; echo " exit=$? (expected 0)"
          python3 /tmp/dnsq.py 1.1.1.1; echo " exit=$? (expected 0)"
          echo "== C) curl (direct rule): STUN-like UDP of a direct program is untouched: dig +notcp"
          dig +short +notcp +time=3 example.com @1.1.1.1 | head -1
          stop
          echo "== D) udp=block: python3 STUN must fail fast"
          start block 0 "$TEST_PROXY_UDP"
          t0=$(date +%s); python3 /tmp/stun.py 4; echo " exit=$? (expected 2, failed) after $(( $(date +%s) - t0 )) s"
          stop
          echo "== E) udp=proxy with a proxy WITHOUT UDP (TEST_PROXY): blocked, no leak"
          start proxy 0 "$TEST_PROXY"
          python3 /tmp/stun.py 4; echo " exit=$? (expected 2, failed)"
          stop
          echo "== F) udp=direct: python3 STUN shows the machine's own IP $direct_ip"
          start direct 0 "$TEST_PROXY_UDP"
          python3 /tmp/stun.py 6; echo " exit=$? (expected 0, IP $direct_ip)"
          stop
          echo "== daemon log (udp/dns lines)"; sudo grep -E "udp |dns|refuses|up:" /Library/Logs/ProxyBridge/pbcore.log | tail -n 40
          sudo /bin/sh "$app/uninstall-helper.sh" >/dev/null
          exit 0

    artifacts:
      - out/*.pkg
      - out/*.zip
      - out/*.log

# /etc/nginx/sites-available/proxybridge.org
# Enable: ln -s /etc/nginx/sites-available/proxybridge.org /etc/nginx/sites-enabled/
# Certificates: certbot --nginx -d proxybridge.org -d www.proxybridge.org

upstream proxybridge_app {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxybridge.org www.proxybridge.org;

    # ACME challenge for certbot (webroot mode); keep before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.proxybridge.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proxybridge.org;

    ssl_certificate /etc/letsencrypt/live/proxybridge.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxybridge.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://www.proxybridge.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.proxybridge.org;

    ssl_certificate /etc/letsencrypt/live/proxybridge.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxybridge.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://proxybridge_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
